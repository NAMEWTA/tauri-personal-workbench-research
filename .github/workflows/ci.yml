name: CI
on:
  workflow_call:
    inputs:
      force_all:
        description: Run every verification job regardless of changed paths
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      contract: ${{ steps.filter.outputs.contract }}
      windows: ${{ steps.filter.outputs.windows }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: ${{ !inputs.force_all }}
        with:
          filters: |
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/desktop/e2e/**'
              - 'apps/desktop/package.json'
              - 'pnpm-lock.yaml'
            go:
              - 'services/workbenchd/**'
              - 'scripts/go.mjs'
            rust:
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            macos:
              - 'apps/desktop/**'
              - 'services/workbenchd/**'
              - 'scripts/**'
              - 'api/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
            contract:
              - 'api/**'
              - 'scripts/generate-go.mjs'
              - 'apps/desktop/src/generated/**'
              - 'services/workbenchd/internal/api/generated/**'
            windows:
              - 'apps/desktop/**'
              - 'services/workbenchd/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
  frontend:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.6.0 }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:frontend
  go:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.go == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/workbenchd/go.sum
      - run: go -C services/workbenchd mod verify
      - run: go -C services/workbenchd vet ./...
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12.2
          working-directory: services/workbenchd
          args: --timeout=5m
      - run: go -C services/workbenchd test -race ./...
  contract:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.6.0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/workbenchd/go.sum
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contract
      - run: pnpm generate
      - run: git diff --exit-code -- api/openapi.yaml apps/desktop/src/generated services/workbenchd/internal/api/generated
  rust:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.6.0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/workbenchd/go.sum
      - run: node scripts/build-sidecar.mjs
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  macos-native:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.6.0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/workbenchd/go.sum
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Build Darwin sidecar
        shell: bash
        run: pnpm build:sidecar
      - run: pnpm verify:versions
      - name: Smoke test Darwin sidecar lifecycle
        shell: bash
        run: node scripts/smoke-sidecar.mjs
      - name: Build macOS app bundle
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          pnpm --dir apps/desktop tauri build --target "$target" --bundles app
          app=$(find "target/$target/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          test -f "$app/Contents/Info.plist"
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"
          sidecar=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'workbenchd*' -print -quit)
          test -x "$sidecar"
      - name: Collect macOS native evidence
        shell: bash
        run: |
          mkdir -p artifacts
          target="$(rustc -vV | sed -n 's/^host: //p')"
          app=$(find "target/$target/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          executable="$app/Contents/MacOS/$executable_name"
          sidecar=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'workbenchd*' -print -quit)
          test -x "$executable"
          test -x "$sidecar"
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "go=$(go version)"
            echo "rust=$(rustc --version)"
            echo "rust_host=$target"
            echo "sidecar_smoke=node scripts/smoke-sidecar.mjs"
            echo "rust_checks=cargo fmt --all -- --check; cargo clippy --workspace --all-targets -- -D warnings; cargo test --workspace; cargo check --workspace --all-targets"
            echo "app=$app"
            echo "app_executable=$executable"
            echo "app_sha256=$(shasum -a 256 "$executable" | cut -d ' ' -f 1)"
            echo "sidecar=$sidecar"
            echo "sidecar_sha256=$(shasum -a 256 "$sidecar" | cut -d ' ' -f 1)"
            codesign --verify --deep --strict --verbose=2 "$app" >/dev/null
            echo "codesign=verified"
          } | tee artifacts/macos-native-evidence.txt
      - name: Upload macOS native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-workbench-macos-native-evidence
          path: artifacts/macos-native-evidence.txt
          if-no-files-found: error
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace --all-targets
  windows-smoke:
    needs: changes
    if: inputs.force_all || needs.changes.outputs.windows == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.6.0 }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/workbenchd/go.sum
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.96.0 --profile minimal --target x86_64-pc-windows-msvc
      - run: pnpm verify:versions
      - run: pnpm build:sidecar
      - run: pnpm --dir apps/desktop build
      - run: pnpm --dir apps/desktop exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - run: cargo check --workspace --all-targets
  required:
    if: always()
    needs: [changes, frontend, go, contract, rust, macos-native, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test '${{ needs.changes.result }}' = success
          test '${{ needs.frontend.result }}' != failure
          test '${{ needs.frontend.result }}' != cancelled
          test '${{ needs.go.result }}' != failure
          test '${{ needs.go.result }}' != cancelled
          test '${{ needs.contract.result }}' != failure
          test '${{ needs.contract.result }}' != cancelled
          test '${{ needs.rust.result }}' != failure
          test '${{ needs.rust.result }}' != cancelled
          test "${{ needs['macos-native'].result }}" != failure
          test "${{ needs['macos-native'].result }}" != cancelled
          test '${{ needs.windows-smoke.result }}' != failure
          test '${{ needs.windows-smoke.result }}' != cancelled
