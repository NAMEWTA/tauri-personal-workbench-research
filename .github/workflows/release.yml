name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact_name: personal-workbench-windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact_name: personal-workbench-darwin-aarch64
    runs-on: ${{ matrix.platform }}
    env:
      CI: true
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.6.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/workbenchd/go.sum
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify release version
        shell: bash
        run: |
          pnpm verify:versions
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm build:sidecar
      - name: Build installer
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: false
      - name: Verify bundle artifact
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.target }}/release/bundle/${{ matrix.bundles }}"
          case "${{ matrix.bundles }}" in
            dmg) extension=dmg ;;
            nsis) extension=exe ;;
            *) echo "Unsupported bundle: ${{ matrix.bundles }}" >&2; exit 1 ;;
          esac
          artifact=$(find "$bundle_dir" -type f -name "*.$extension" -print | head -n 1)
          test -n "$artifact"
          node -e 'const fs=require("fs"); const crypto=require("crypto"); const path=process.argv[1]; const hash=crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex"); console.log(`${hash}  ${path}`)' "$artifact"
      - name: Verify macOS application bundle
        if: matrix.bundles == 'dmg'
        shell: bash
        run: |
          app=$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          test -f "$app/Contents/Info.plist"
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"
          sidecar=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'workbenchd*' -print -quit)
          test -n "$sidecar"
          test -x "$sidecar"
          echo "codesign=unavailable-for-cross-target-bundle"
      - name: Verify macOS disk image
        if: matrix.bundles == 'dmg'
        shell: bash
        run: |
          artifact=$(find "target/${{ matrix.target }}/release/bundle/dmg" -type f -name '*.dmg' -print -quit)
          test -n "$artifact"
          hdiutil verify "$artifact"
      - name: Collect macOS bundle evidence
        if: matrix.bundles == 'dmg'
        shell: bash
        run: |
          mkdir -p artifacts
          app=$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          executable="$app/Contents/MacOS/$executable_name"
          sidecar=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -name 'workbenchd*' -print -quit)
          dmg=$(find "target/${{ matrix.target }}/release/bundle/dmg" -type f -name '*.dmg' -print -quit)
          {
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "target=${{ matrix.target }}"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "go=$(go version)"
            echo "rust=$(rustc --version)"
            echo "app=$app"
            echo "app_executable=$executable"
            echo "app_sha256=$(shasum -a 256 "$executable" | cut -d ' ' -f 1)"
            echo "sidecar=$sidecar"
            echo "sidecar_sha256=$(shasum -a 256 "$sidecar" | cut -d ' ' -f 1)"
            echo "dmg=$dmg"
            echo "dmg_sha256=$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)"
            echo "codesign=unavailable-for-cross-target-bundle"
            hdiutil verify "$dmg" >/dev/null
            echo "hdiutil=verified"
          } | tee artifacts/macos-bundle-evidence.txt
      - name: Upload macOS bundle evidence
        if: matrix.bundles == 'dmg'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-workbench-macos-bundle-evidence
          path: artifacts/macos-bundle-evidence.txt
          if-no-files-found: error
      - name: Smoke test installed Windows bundle
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-installed.ps1 -TargetTriple '${{ matrix.target }}'
      - name: Smoke test native single-instance behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke-single-instance.ps1 -TargetTriple '${{ matrix.target }}'
      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.bundles }}/*
          if-no-files-found: error

  metadata:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.6.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache-dependency-path: services/workbenchd/go.sum
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-workbench-release-metadata
          path: artifacts/sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: [verify, build, metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: personal-workbench-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: node scripts/generate-hashes.mjs release-assets
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag
          --latest
          --title "个人工作台 $GITHUB_REF_NAME"
          --generate-notes
          --notes "Windows 安装包尚未使用商业证书签名；macOS 安装包使用 ad-hoc 签名，首次打开时可能需要在“隐私与安全性”中确认。安装前请核对 SHA256SUMS.txt。"
